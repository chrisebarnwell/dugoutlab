<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 170" role="img" aria-label="DugoutLab flask with baseball bubbles">
  <!-- Escaping baseball bubbles -->
  <g stroke="#C8862E" fill="#f4efe6" stroke-width="2.5">
    <circle cx="92" cy="26" r="9"/>
    <circle cx="62" cy="14" r="6"/>
    <circle cx="44" cy="34" r="4.5"/>
  </g>
  <!-- Seams on the big escaping baseball -->
  <g stroke="#C8862E" fill="none" stroke-width="1.8" stroke-linecap="round">
    <path d="M86 19 q4 7 0 14"/>
    <path d="M98 19 q-4 7 0 14"/>
    <path d="M58.5 9.5 q2.6 4.5 0 9"/>
    <path d="M65.5 9.5 q-2.6 4.5 0 9"/>
  </g>
  <!-- Flask body -->
  <path d="M55 44 L55 78 L26 138 q-5 12 8 12 L106 150 q13 0 8 -12 L85 78 L85 44 Z"
        fill="none" stroke="#1a3024" stroke-width="5" stroke-linejoin="round"/>
  <!-- Flask lip -->
  <path d="M49 44 L91 44" stroke="#1a3024" stroke-width="5" stroke-linecap="round"/>
  <!-- Liquid -->
  <path d="M64.5 100 L36 138 q-3.4 8 5.2 8 L99 146 q8.6 0 5.2 -8 L75.5 100 Z"
        fill="#C8862E" opacity="0.92"/>
  <path d="M64.5 100 L75.5 100 L70 92 Z" fill="#C8862E" opacity="0.92"/>
  <!-- Baseball bubbles inside liquid -->
  <g stroke="#0F1F18" stroke-width="1.6" fill="#f4efe6">
    <circle cx="60" cy="126" r="6.5"/>
    <circle cx="82" cy="134" r="5"/>
    <circle cx="70" cy="112" r="4"/>
  </g>
  <g stroke="#0F1F18" fill="none" stroke-width="1.2" stroke-linecap="round">
    <path d="M56.2 121.5 q2.8 4.8 0 9.4"/>
    <path d="M63.8 121.5 q-2.8 4.8 0 9.4"/>
    <path d="M79 130.5 q2.2 3.7 0 7.2"/>
    <path d="M85 130.5 q-2.2 3.7 0 7.2"/>
  </g>
</svg>
